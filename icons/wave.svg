<svg width="860" height="170" viewBox="0 0 860 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="waveBodyDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="waveDeepDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <style>
    .wave-deep { fill: url(#waveDeepDark); }
    .wave-mid { fill: url(#waveBodyDark); }
    .wave-line-bg { stroke: #2a2a2a; stroke-width: 1.2; fill: none; }
    .wave-line-pulse { stroke: url(#waveGlow); stroke-width: 2; fill: none; stroke-linecap: round; }
    .badge-base { fill: #000000; stroke: #2a2a2a; stroke-width: 1.2; rx: 6px; }
    .badge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.6px; }
    .badge-icon { fill: #ffffff; }
    .count-bg { fill: #ffffff; rx: 4px; }
    .count-text { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', monospace; font-size: 11px; font-weight: 800; fill: #000000; letter-spacing: 0.3px; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 13px; fill: #888888; letter-spacing: 0.3px; }
    .footer-brand { font-weight: 800; fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .wave-deep { fill: #f0f0f0; }
      .wave-mid { fill: #e5e5e5; }
      .wave-line-bg { stroke: #cccccc; }
      .badge-base { fill: #ffffff; stroke: #000000; }
      .badge-label { fill: #000000; }
      .badge-icon { fill: #000000; }
      .count-bg { fill: #000000; }
      .count-text { fill: #ffffff; }
      .footer-text { fill: #555555; }
      .footer-brand { fill: #000000; }
    }
  </style>

  <!-- Deep Wave Layer (Slow Oscillating Motion) -->
  <path class="wave-deep" d="M 0 45 Q 107 25 215 45 T 430 45 T 645 45 T 860 45 L 860 170 L 0 170 Z">
    <animate attributeName="d" 
      values="M 0 45 Q 107 25 215 45 T 430 45 T 645 45 T 860 45 L 860 170 L 0 170 Z;
              M 0 45 Q 107 65 215 45 T 430 45 T 645 45 T 860 45 L 860 170 L 0 170 Z;
              M 0 45 Q 107 25 215 45 T 430 45 T 645 45 T 860 45 L 860 170 L 0 170 Z" 
      dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Mid Wave Layer (Counter Oscillating Motion) -->
  <path class="wave-mid" d="M 0 35 Q 107 55 215 35 T 430 35 T 645 35 T 860 35 L 860 170 L 0 170 Z">
    <animate attributeName="d" 
      values="M 0 35 Q 107 55 215 35 T 430 35 T 645 35 T 860 35 L 860 170 L 0 170 Z;
              M 0 35 Q 107 15 215 35 T 430 35 T 645 35 T 860 35 L 860 170 L 0 170 Z;
              M 0 35 Q 107 55 215 35 T 430 35 T 645 35 T 860 35 L 860 170 L 0 170 Z" 
      dur="4.5s" repeatCount="indefinite" />
  </path>

  <!-- Crest Wave Line Base -->
  <path class="wave-line-bg" d="M 0 25 Q 107 5 215 25 T 430 25 T 645 25 T 860 25">
    <animate attributeName="d" 
      values="M 0 25 Q 107 5 215 25 T 430 25 T 645 25 T 860 25;
              M 0 25 Q 107 45 215 25 T 430 25 T 645 25 T 860 25;
              M 0 25 Q 107 5 215 25 T 430 25 T 645 25 T 860 25" 
      dur="3.8s" repeatCount="indefinite" />
  </path>

  <!-- Glowing Crest Wave Pulse -->
  <path class="wave-line-pulse" d="M 0 25 Q 107 5 215 25 T 430 25 T 645 25 T 860 25">
    <animate attributeName="d" 
      values="M 0 25 Q 107 5 215 25 T 430 25 T 645 25 T 860 25;
              M 0 25 Q 107 45 215 25 T 430 25 T 645 25 T 860 25;
              M 0 25 Q 107 5 215 25 T 430 25 T 645 25 T 860 25" 
      dur="3.8s" repeatCount="indefinite" />
  </path>

  <!-- Integrated Profile Views Badge -->
  <g transform="translate(330, 68)">
    <rect x="0" y="0" width="200" height="30" rx="6" class="badge-base" />
    <g transform="translate(10, 7) scale(0.9)">
      <path class="badge-icon" d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 0 1 0-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.825.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/>
    </g>
    <text x="32" y="18.5" class="badge-label">PROFILE VIEWS</text>
    <rect x="130" y="4" width="64" height="22" rx="4" class="count-bg" />
    <text x="162" y="18.5" text-anchor="middle" class="count-text">1,541+</text>
  </g>

  <!-- Integrated Copyright & Signature -->
  <text x="430" y="132" text-anchor="middle" class="footer-text">
    © 2026 <tspan class="footer-brand">||BTL||™</tspan> · Designed with Pure <tspan fill="#ff3b30">❤️</tspan>
  </text>
</svg>