<svg width="106" height="26" viewBox="0 0 106 26" xmlns="http://www.w3.org/2000/svg">
  <style>
    .btn-bg { fill: #000000; stroke: #333333; stroke-width: 1; rx: 6px; }
    .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    .btn-icon { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .btn-bg { fill: #ffffff; stroke: #000000; }
      .btn-text { fill: #000000; }
      .btn-icon { fill: #000000; }
    }
  </style>
  <rect x="1" y="1" width="104" height="24" class="btn-bg" />
  <g transform="translate(10, 6) scale(0.58)">
    <polygon points="5 3 19 12 5 21 5 3" fill="#ffffff"/>
  </g>
  <text x="32" y="17" class="btn-text">Play Store</text>
</svg>