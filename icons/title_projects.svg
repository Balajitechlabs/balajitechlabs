<svg width="250" height="22" viewBox="0 0 250 22" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: #ffffff;
    }
    .icon {
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    @media (prefers-color-scheme: light) {
      .title-text { fill: #000000; }
      .icon { stroke: #000000; }
    }
  </style>
  <g transform="translate(0, 3) scale(0.68)">
    <polyline points="16 18 22 12 16 6" class="icon" />
    <polyline points="8 6 2 12 8 18" class="icon" />
  </g>
  <text x="24" y="16" class="title-text">FEATURED PROJECTS :</text>
</svg>
