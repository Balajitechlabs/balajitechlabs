<svg width="440" height="80" viewBox="0 0 440 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="whiteLinePulse" x1="-100%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#30363d" />
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .badge {
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #8b949e;
    }
    @media (prefers-color-scheme: light) {
      .badge { fill: #57606a; }
      .title { fill: #000000; }
    }
  </style>
  <text x="0" y="34" class="title">balajitechlabs- :)</text>
  <text x="2" y="55" class="badge">||BTL||™</text>
  <line x1="0" y1="68" x2="380" y2="68" stroke="#30363d" stroke-width="1" />
  <line x1="0" y1="68" x2="220" y2="68" stroke="url(#whiteLinePulse)" stroke-width="1.5" stroke-linecap="round" />
</svg>