  </g>

  <!-- Title -->
  <text x="60" y="37" class="card-title">quickdash</text>

  <!-- Category Tag -->
  <rect x="350" y="20" width="92" height="20" class="tag-bg" />
  <text x="396" y="34" text-anchor="middle" class="tag-text">ANDROID</text>

  <!-- Description -->
  <text x="18" y="68" class="card-desc">Unified utility dashboard for Android. Instant UPI &amp; PayPal</text>
  <text x="18" y="86" class="card-desc">collection, WhatsApp direct chat, and rapid shortcuts.</text>

  <!-- Stack Chips -->
  
  <rect x="18" y="110" width="62" height="22" class="pill-bg" />
  <text x="49" y="125" text-anchor="middle" class="pill-text">Kotlin</text>
  <rect x="88" y="110" width="124" height="22" class="pill-bg" />
  <text x="150" y="125" text-anchor="middle" class="pill-text">Jetpack Compose</text>
  <rect x="220" y="110" width="82" height="22" class="pill-bg" />
  <text x="261" y="125" text-anchor="middle" class="pill-text">Material 3</text>

  <!-- Star Counter -->
  <text x="410" y="125" class="meta-text" text-anchor="end">★ 25</text>

  <!-- Card Internal Divider -->
  <line x1="18" y1="150" x2="442" y2="150" class="divider" />

  <!-- Centered Buttons Inside Card -->
  
  <rect x="86" y="168" width="88" height="26" class="inner-btn-bg" />
  <g transform="translate(94, 173) scale(0.55)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#ffffff" stroke-width="2"/><line x1="2" y1="12" x2="22" y2="12" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="114" y="185" class="inner-btn-text">Website</text>
  <rect x="184" y="168" width="98" height="26" class="inner-btn-bg" />
  <g transform="translate(192, 173) scale(0.55)">
    <polygon points="5 3 19 12 5 21 5 3" fill="#ffffff"/>
  </g>
  <text x="212" y="185" class="inner-btn-text">Play Store</text>
  <rect x="292" y="168" width="82" height="26" class="inner-btn-bg" />
  <g transform="translate(300, 173) scale(0.55)">
