<svg width="370" height="22" viewBox="0 0 370 22" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#777777" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#777777" />
      <stop offset="100%" stop-color="#444444" />
      <animate attributeName="x1" values="-100%;150%" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;250%" dur="3.8s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: url(#titleShimmer);
    }
    .icon {
      stroke: url(#titleShimmer);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    @media (prefers-color-scheme: light) {
      .title-text { fill: #181717; }
      .icon { stroke: #181717; }
    }
  </style>
  <g transform="translate(0, 2)">
    <polyline points="11 12 15 8 11 4" class="icon"/><polyline points="5 4 1 8 5 12" class="icon"/>
  </g>
  <text x="24" y="16" class="title-text">CORE TECH STACK &amp; STARTUP ARSENAL :</text>
</svg>