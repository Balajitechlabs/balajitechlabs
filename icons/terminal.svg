<svg width="780" height="245" viewBox="0 0 780 245" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monoBorderGlow" x1="-100%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#30363d" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #000000; }
    .header-bg { fill: #111111; }
    .title-text { fill: #888888; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    .prompt { fill: #777777; font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 700; }
    .cmd { fill: #ffffff; font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 700; }
    .output { fill: #cccccc; font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; }
    .highlight { fill: #ffffff; font-weight: 800; }
    .dot { fill: #2a2a2a; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .header-bg { fill: #f0f0f0; }
      .title-text { fill: #666666; }
      .prompt { fill: #888888; }
      .cmd { fill: #000000; }
      .output { fill: #333333; }
      .highlight { fill: #000000; }
      .dot { fill: #e0e0e0; }
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="778" height="243" rx="10" class="bg" stroke="url(#monoBorderGlow)" stroke-width="1.5" />

  <!-- Header -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 769 1 A 10 10 0 0 1 779 11 L 779 34 L 1 34 Z" class="header-bg" />
  <line x1="1" y1="34" x2="779" y2="34" stroke="#222222" stroke-width="1" />

  <!-- Pure Monochrome Dots -->
  <circle cx="20" cy="17" r="5" class="dot" stroke="#444444" stroke-width="1" />
  <circle cx="36" cy="17" r="5" class="dot" stroke="#444444" stroke-width="1" />
  <circle cx="52" cy="17" r="5" class="dot" stroke="#444444" stroke-width="1" />

  <!-- Title -->
  <text x="390" y="21" text-anchor="middle" class="title-text">balajitechlabs — zsh — 80x24</text>

  <!-- Line 1: whoami -->
  <text x="24" y="62" class="prompt">$ </text>
  <text x="40" y="62" class="cmd">whoami</text>
  <text x="24" y="82" class="output">❯ Solo Startup Founder &amp; Android/Full-Stack Architect @ <tspan class="highlight">||BTL||™</tspan></text>

  <!-- Line 2: current_focus -->
  <text x="24" y="110" class="prompt">$ </text>
  <text x="40" y="110" class="cmd">current_focus</text>
  <text x="24" y="130" class="output">❯ Modern Jetpack Compose • Material 3 Expressive • Reactive Systems</text>

  <!-- Line 3: philosophy -->
  <text x="24" y="158" class="prompt">$ </text>
  <text x="40" y="158" class="cmd">philosophy</text>
  <text x="24" y="178" class="output">❯ <tspan class="highlight">"Obsessed with buttery 120Hz UI, clean architecture &amp; zero bloat"</tspan></text>

  <!-- Line 4: status -->
  <text x="24" y="206" class="prompt">$ </text>
  <text x="40" y="206" class="cmd">status</text>
  <text x="24" y="226" class="output">❯ Shipping QuickDash v5.2.4 Live 🚀</text>

  <!-- Blinking White Cursor -->
  <rect x="290" y="213" width="8" height="15" fill="#ffffff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
