<svg width="460" height="208" viewBox="0 0 460 208" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#666666" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#666666" />
      <stop offset="100%" stop-color="#333333" />
      <animate attributeName="x1" values="-100%;150%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;250%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="borderPulse" x1="-100%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#222222" />
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    .card-bg { fill: #000000; stroke: #2a2a2a; stroke-width: 1.5; rx: 12px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 16px; font-weight: 800; fill: url(#chromeShimmer); }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; fill: #a0a0a0; line-height: 1.4; }
    .pill-bg { fill: #111111; stroke: #2a2a2a; stroke-width: 1; rx: 4px; }
    .pill-text { font-family: 'SF Mono', monospace; font-size: 9.5px; font-weight: 600; fill: #ffffff; }
    .tag-bg { fill: #161616; stroke: #333333; stroke-width: 1; rx: 10px; }
    .tag-text { font-family: 'SF Mono', monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #888888; }
    .logo-path { fill: #ffffff; }
    .logo-stroke { stroke: #ffffff; }
    .logo-fill { fill: #ffffff; }
    .inner-btn-bg { fill: #111111; stroke: #333333; stroke-width: 1; rx: 6px; }
    .inner-btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .divider { stroke: #222222; stroke-width: 1; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #ffffff; stroke: #000000; }
      .card-title { fill: #000000; }
      .card-desc { fill: #333333; }
      .pill-bg { fill: #ffffff; stroke: #000000; }
      .pill-text { fill: #000000; }
      .tag-bg { fill: #000000; stroke: #000000; }
      .tag-text { fill: #ffffff; }
      .meta-text { fill: #000000; }
      .logo-path { fill: #000000; }
      .logo-stroke { stroke: #000000; }
      .logo-fill { fill: #000000; }
      .inner-btn-bg { fill: #ffffff; stroke: #000000; }
      .inner-btn-text { fill: #000000; }
      .divider { stroke: #e1e4e8; }
    }
  </style>

  <!-- Card Background (Pure Pitch Black #000000) -->
  <rect x="1" y="1" width="458" height="206" class="card-bg" />

  <!-- Animated Top Monochrome Accent Line -->
  <line x1="16" y1="1" x2="160" y2="1" stroke="url(#borderPulse)" stroke-width="2" stroke-linecap="round" />

  
  <!-- Logo (BTL Geometric Hexagon) -->
  <g transform="translate(18, 16) scale(0.32)">
    <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" fill="none" class="logo-stroke" stroke-width="6" stroke-linejoin="round" />
    <text x="50" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="2" class="logo-fill">BTL</text>
  </g>

  <!-- Title -->
  <text x="60" y="37" class="card-title">balajitechlab.com</text>

  <!-- Category Tag -->
  <rect x="330" y="20" width="112" height="20" class="tag-bg" />
  <text x="386" y="34" text-anchor="middle" class="tag-text">OFFICIAL HUB</text>

  <!-- Description -->
  <text x="18" y="68" class="card-desc">Official digital ecosystem, portfolio, and high-performance</text>
  <text x="18" y="86" class="card-desc">web platform for balajitechlabs and open-source releases.</text>

  <!-- Stack Chips -->
  
  <rect x="18" y="110" width="64" height="22" class="pill-bg" />
  <text x="50" y="125" text-anchor="middle" class="pill-text">Next.js</text>
  <rect x="90" y="110" width="56" height="22" class="pill-bg" />
  <text x="118" y="125" text-anchor="middle" class="pill-text">React</text>
  <rect x="154" y="110" width="86" height="22" class="pill-bg" />
  <text x="197" y="125" text-anchor="middle" class="pill-text">TypeScript</text>
  <rect x="248" y="110" width="72" height="22" class="pill-bg" />
  <text x="284" y="125" text-anchor="middle" class="pill-text">Tailwind</text>

  <!-- Star Counter -->
  <text x="410" y="125" class="meta-text" text-anchor="end">★ 5</text>

  <!-- Card Internal Divider -->
  <line x1="18" y1="150" x2="442" y2="150" class="divider" />

  <!-- Centered Buttons Inside Card -->
  
  <rect x="138" y="168" width="90" height="26" class="inner-btn-bg" />
  <g transform="translate(146, 173) scale(0.55)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#ffffff" stroke-width="2"/><line x1="2" y1="12" x2="22" y2="12" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="166" y="185" class="inner-btn-text">Website</text>
  <rect x="238" y="168" width="84" height="26" class="inner-btn-bg" />
  <g transform="translate(246, 173) scale(0.55)">
    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" fill="#ffffff"/>
  </g>
  <text x="266" y="185" class="inner-btn-text">GitHub</text>
</svg>