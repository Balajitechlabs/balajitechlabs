<svg width="460" height="154" viewBox="0 0 460 154" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#666666" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#666666" />
      <stop offset="100%" stop-color="#333333" />
      <animate attributeName="x1" values="-100%;150%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;250%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="borderPulse" x1="-100%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#222222" />
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    .card-bg { fill: #000000; stroke: #2a2a2a; stroke-width: 1.5; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 16px; font-weight: 800; fill: url(#chromeShimmer); }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; fill: #a0a0a0; line-height: 1.4; }
    .tag-bg { fill: #ffffff; stroke: #ffffff; stroke-width: 1; rx: 10px; }
    .tag-text { font-family: 'SF Mono', monospace; font-size: 9.5px; font-weight: 800; fill: #000000; letter-spacing: 0.5px; }
    .badge-bg { fill: #ffffff; stroke: #ffffff; stroke-width: 1; rx: 4px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', monospace; font-size: 9px; font-weight: 700; fill: #000000; letter-spacing: 0.2px; }
    .badge-icon-fill { fill: #000000; }
    .logo-path { fill: #ffffff; }
    .logo-stroke { stroke: #ffffff; }
    .logo-fill { fill: #ffffff; }
    .divider { stroke: #2a2a2a; stroke-width: 1.5; }
    @media (prefers-color-scheme: light) {
      .card-bg { fill: #ffffff; stroke: #000000; }
      .card-title { fill: #000000; }
      .card-desc { fill: #333333; }
      .tag-bg { fill: #000000; stroke: #000000; }
      .tag-text { fill: #ffffff; }
      .badge-bg { fill: #000000; stroke: #000000; }
      .badge-text { fill: #ffffff; }
      .badge-icon-fill { fill: #ffffff; }
      .logo-path { fill: #000000; }
      .logo-stroke { stroke: #000000; }
      .logo-fill { fill: #000000; }
      .divider { stroke: #000000; }
    }
  </style>

  <!-- Card Body (Top Piece) -->
  <path d="M 1 154 L 1 12 Q 1 1 12 1 L 448 1 Q 459 1 459 12 L 459 154 L 1 154 Z" class="card-bg" />

  <!-- Animated Top Monochrome Accent Line -->
  <line x1="16" y1="1" x2="160" y2="1" stroke="url(#borderPulse)" stroke-width="2" stroke-linecap="round" />

  <!-- Logo (BTL Geometric Hexagon) -->
  <g transform="translate(18, 16) scale(0.32)">
    <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" fill="none" class="logo-stroke" stroke-width="6" stroke-linejoin="round" />
    <text x="50" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="2" class="logo-fill">BTL</text>
  </g>

  <!-- Title -->
  <text x="60" y="37" class="card-title">balajitechlab.com</text>

  <!-- Category Tag (Inverted High Contrast) -->
  <rect x="330" y="20" width="112" height="20" class="tag-bg" />
  <text x="386" y="34" text-anchor="middle" class="tag-text">OFFICIAL HUB</text>

  <!-- Description -->
  <text x="18" y="68" class="card-desc">Official digital ecosystem, portfolio, and high-performance</text>
  <text x="18" y="86" class="card-desc">web platform for balajitechlabs and open-source releases.</text>

  <!-- GitHub Badge Style Tech & Repo Metadata Row (Inverted High Contrast) -->
  <!-- Next.js -->
  <rect x="18" y="112" width="50" height="18" class="badge-bg" />
  <text x="43" y="124.5" text-anchor="middle" class="badge-text">Next.js</text>

  <!-- React -->
  <rect x="72" y="112" width="44" height="18" class="badge-bg" />
  <text x="94" y="124.5" text-anchor="middle" class="badge-text">React</text>

  <!-- TS -->
  <rect x="120" y="112" width="28" height="18" class="badge-bg" />
  <text x="134" y="124.5" text-anchor="middle" class="badge-text">TS</text>

  <!-- Tailwind -->
  <rect x="152" y="112" width="54" height="18" class="badge-bg" />
  <text x="179" y="124.5" text-anchor="middle" class="badge-text">Tailwind</text>

  <!-- Last Commit Badge (Official GitHub Octicon git-commit) -->
  <rect x="212" y="112" width="68" height="18" class="badge-bg" />
  <g transform="translate(216, 115.5) scale(0.65)">
    <path class="badge-icon-fill" d="M11.93 8.5a4.002 4.002 0 0 1-7.86 0H.75a.75.75 0 0 1 0-1.5h3.32a4.002 4.002 0 0 1 7.86 0h3.32a.75.75 0 0 1 0 1.5Zm-1.43-.75a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z" />
  </g>
  <text x="252" y="124.5" text-anchor="middle" class="badge-text">Sep 28</text>

  <!-- MIT License Badge -->
  <rect x="286" y="112" width="38" height="18" class="badge-bg" />
  <text x="305" y="124.5" text-anchor="middle" class="badge-text">MIT</text>

  <!-- Star Badge (Official GitHub Octicon star-fill) -->
  <rect x="330" y="112" width="42" height="18" class="badge-bg" />
  <g transform="translate(334, 115.5) scale(0.65)">
    <path class="badge-icon-fill" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" />
  </g>
  <text x="356" y="124.5" text-anchor="middle" class="badge-text">5</text>

  <!-- Bottom Divider Line -->
  <line x1="1" y1="153" x2="459" y2="153" class="divider" />
</svg>