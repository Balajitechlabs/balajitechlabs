name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: '0 0,12 * * *'   # 12:00 AM & 12:00 PM UTC
    - cron: '30 6,18 * * *'  # 12:00 PM & 12:00 AM IST (Indian Standard Time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Balajitechlabs
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=white&color_dots=#161616,#333333,#666666,#aaaaaa,#ffffff

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
