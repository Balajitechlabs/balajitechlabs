name: Update Contribution Calendar

on:
  schedule:
    - cron: '0 0,12 * * *'   # 12:00 AM & 12:00 PM UTC
    - cron: '30 6,18 * * *'  # 12:00 PM & 12:00 AM IST (Indian Standard Time)
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'icons/**'
      - 'README.md'
      - 'PROFILE_README.md'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Calendar Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_calendar.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "balajtechlabs"
          git config --global user.email "admin@balajitechlab.com"
          git add icons/calendar.svg icons/streak.svg icons/profile_views.svg icons/wave.svg icons/footer_wave.svg icons/card_quickdash_top.svg icons/card_btl_top.svg icons/card_quickdash.svg icons/card_btl.svg
          if git diff --staged --quiet; then
            echo "No calendar, streak, view, or project badge updates at this cycle."
          else
            git commit -m "chore(profile): update contribution calendar, streak, views & project badges [skip ci]"
            git push
          fi
